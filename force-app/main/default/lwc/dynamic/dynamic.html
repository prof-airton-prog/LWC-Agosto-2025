<template>
    <lightning-card title = "Criar lead com página personalizada" icon-name="standard:lead">
        <div class="slds-var-m-around_medium slds-grid slds-wrap slds-gutters">

            <div class="slds-col slds-size_1-of-1 slds-var-m-bottom_small">
                <p>Preencha os dados abaixo: Ao clicar no botão, será aberta a tela padrão de criação de Lead com esses valores já preenchidos</p>
            </div>

            <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-3">
                <lightning-input
                    type="text"
                    label="Firstname"
                    name="firstName"
                    value={firstName}
                    onchange={handleInputChange}>
                </lightning-input>
            </div>

            <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-3">
                <lightning-input
                    type="text"
                    label="Lastname"
                    name="lastName"
                    value={lastName}
                    onchange={handleInputChange}
                    required>
                </lightning-input>
            </div>

            <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-3">
                <lightning-input
                    type="text"
                    label="Company"
                    name="company"
                    value={company}
                    onchange={handleInputChange}
                    required>
                </lightning-input>
            </div>

            <div class="slds-col slds-size_1-of-1 slds-var-m-top_medium">
                <lightning-button
                    label="Ir para tela de Novo Lead"
                    variant="brand"
                    onclick={goToNewLead}
                    class="slds-var-m-right_small">
                </lightning-button>
            </div>
        </div>
    </lightning-card>
</template>
